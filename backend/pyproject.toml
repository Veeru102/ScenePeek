[project]
name = "scenepeek"
version = "0.1.0"
description = "Multimodal video search: find moments in videos with natural language"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "boto3>=1.35",
    "httpx>=0.27",
    "typer>=0.12",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# query-side encoders only (what the API process needs)
ml-query = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "scikit-learn>=1.5",  # learned router (logistic regression) runs in the API process
]
# full worker stack
ml = [
    "scenepeek[ml-query]",
    "faster-whisper>=1.0",
    "rapidocr-onnxruntime>=1.3",
    "pillow>=10.4",
    "imagehash>=4.3",
    "opencv-python-headless>=4.10",
    "wordninja>=2.0",
]
# benchmark ingestion (YouTube-hosted datasets such as QVHighlights) + reranker fine-tuning
bench = [
    "yt-dlp>=2024.8",
    "datasets>=3.0",
    "accelerate>=1.0",
]
# Apple-silicon ASR via MLX (optional; select with WHISPER_BACKEND=mlx_whisper)
mlx = [
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pillow>=10.4",  # pipeline modules import PIL at module level
    "scikit-learn>=1.5",  # learned-router tests
]

[project.scripts]
scenepeek = "scenepeek.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scenepeek"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

# CPU-only torch wheels inside Linux containers; macOS keeps the default (MPS-capable) build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
