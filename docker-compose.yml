name: scenepeek

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scenepeek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scenepeek}
      POSTGRES_DB: ${POSTGRES_DB:-scenepeek}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scenepeek}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-scenepeek}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-scenepeek123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-scenepeek} ${S3_SECRET_KEY:-scenepeek123} &&
      mc mb --ignore-existing local/${S3_BUCKET:-scenepeek} &&
      mc anonymous set download local/${S3_BUCKET:-scenepeek} &&
      echo 'bucket ready'
      "

  api:
    build:
      context: ./backend
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scenepeek}:${POSTGRES_PASSWORD:-scenepeek}@postgres:5432/${POSTGRES_DB:-scenepeek}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      HF_HOME: /models
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - hfcache:/models
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "scenepeek migrate && scenepeek api --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  # Optional: run the worker in Docker (CPU only). On macOS prefer `make worker` on the host.
  worker:
    profiles: ["docker-worker"]
    build:
      context: ./backend
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scenepeek}:${POSTGRES_PASSWORD:-scenepeek}@postgres:5432/${POSTGRES_DB:-scenepeek}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      MEDIA_CACHE_DIR: /cache
      HF_HOME: /models
    volumes:
      - ./backend:/app
      - workercache:/cache
      - hfcache:/models
    depends_on:
      postgres:
        condition: service_healthy
    command: scenepeek worker

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    volumes:
      - ./docs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3001:3000"
    volumes:
      - ./docs/observability/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  hfcache:
  workercache:
