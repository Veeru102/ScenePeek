global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    # host workers expose :9101, :9102, ... (one per process)
    static_configs:
      - targets: ["host.docker.internal:9101", "host.docker.internal:9102", "host.docker.internal:9103"]
