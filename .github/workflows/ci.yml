name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scenepeek
          POSTGRES_PASSWORD: scenepeek
          POSTGRES_DB: scenepeek
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U scenepeek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check scenepeek tests
      - run: uv run ruff format --check scenepeek tests
      - run: uv run pytest -q
        env:
          TEST_ADMIN_URL: postgresql://scenepeek:scenepeek@localhost:5434/postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
